AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Forkd - Couples restaurant matching PWA backend

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref ForkdTable
        GOOGLE_API_KEY: '{{resolve:ssm:/forkd/google-api-key}}'
    Layers:
      - !Ref SharedLayer

Resources:
  # --- Shared Lambda Role ---
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ForkdTable.Arn
                  - !Sub "${ForkdTable.Arn}/index/*"

  # --- DynamoDB ---
  ForkdTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: forkd
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Shared Layer ---
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: forkd-shared
      Description: Shared utilities for Forkd Lambdas
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  # --- API Gateway ---
  ForkdApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Partner-Id
        MaxAge: 300

  # --- Lambda Functions ---
  CreateRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-create-room
      Handler: app.handler
      CodeUri: functions/create_room/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /rooms
            Method: POST

  JoinRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-join-room
      Handler: app.handler
      CodeUri: functions/join_room/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /rooms/{code}/join
            Method: POST

  GetRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-get-room
      Handler: app.handler
      CodeUri: functions/get_room/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /rooms/{code}
            Method: GET

  SetLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-set-location
      Handler: app.handler
      CodeUri: functions/set_location/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /rooms/{code}/location
            Method: PUT

  SavePreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-save-preferences
      Handler: app.handler
      CodeUri: functions/save_preferences/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /rooms/{code}/preferences
            Method: POST

  GetCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-get-cards
      Handler: app.handler
      CodeUri: functions/get_cards/
      Timeout: 20
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /cards/{code}
            Method: GET

  RecordSwipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-record-swipe
      Handler: app.handler
      CodeUri: functions/record_swipe/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /swipe
            Method: POST

  GetMatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-get-matches
      Handler: app.handler
      CodeUri: functions/get_matches/
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /matches/{code}
            Method: GET

  UpdateMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-update-match
      Handler: app.handler
      CodeUri: functions/update_match/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /matches/{code}/{place_id}
            Method: PATCH

  TonightsPickFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: forkd-tonights-pick
      Handler: app.handler
      CodeUri: functions/tonights_pick/
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ForkdApi
            Path: /tonight/{code}
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ForkdApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Description: DynamoDB table name
    Value: !Ref ForkdTable
